# Builds the katalogos tool and publishes it, on a tag tool-v<version>.
# Mod repos download it from the newest release (build-mod.yml).
name: tool

on:
  push:
    tags: ["tool-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: tool
        run: cargo test --quiet
      - name: Build
        working-directory: tool
        run: cargo build --release --quiet
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tool/target/release/katalogos katalogos-linux-x86_64
          gh release create "${GITHUB_REF_NAME}" katalogos-linux-x86_64 \
            --title "katalogos tool ${GITHUB_REF_NAME#tool-v}" --notes "The packer and checker the mod workflow uses (docs/publishing.md)."
