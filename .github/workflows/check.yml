# Checks every listed mod where the launcher reads it: on a pull request,
# on main, and once a day (a mod's new release can break after listing).
# An official mod whose listed version is not released yet is built and
# packed from its folder and checked the same way.
name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the official mods that hold code
        run: |
          for b in mods/*/build.sh; do
            [ -e "$b" ] && sh "$b"
          done
      - name: Check the index
        run: katalogos check index.json
