[package]
name = "katalogos"
description = "Builds an eidos mod's release files (mod.bw, mod.json) and checks the katalogos index."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Project-Holon/katalogos"

[dependencies]
eidos-mod = { git = "https://github.com/Project-Holon/morphe", tag = "v0.4.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
